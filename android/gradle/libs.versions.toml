# AGP 8.13 is the last 8.x line and supports compileSdk 36. The AndroidX
# versions are the newest that still compile against 36; later ones need a
# newer SDK, and with it AGP 9.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.17.0"
activity = "1.11.0"
webkit = "1.14.0"
splashscreen = "1.0.1"
# 8.x: the API this app is written against; Play accepts it for new apps into 2027.
billing = "8.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
