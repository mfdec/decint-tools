# onionscope engine catalog
#
# Every engine is queried in parallel for each search. Add or fix engines here without touching code.
#
# Fields
#   name          unique id (used on the CLI / API)
#   label         display name
#   tier          core | extended | experimental   (experimental is off unless --include-experimental)
#   parser        parser name from onionscope/engines/parsers.py ("generic" works for most HTML engines)
#   prep          optional pre-request hook from onionscope/engines/special.py
#   mirrors       v3 onion hosts, tried in order (checksum-validated at load; bad ones are skipped)
#   clearnet      optional https gateway (used after the onion mirrors; the only option in direct mode)
#   search_path   path template, or a list of alternatives tried in order on 404/405.
#                 Placeholders: {q} {page} (1-based) {page0} (0-based) {offset} (= page0 * per_page)
#   clearnet_search_path  optional different path for the clearnet gateway
#   per_page      results per page (for {offset}); max_pages caps pagination
#   weight        trust prior 0..1 used in rank fusion (lower for engines known to push scams/ads)
#   group         engines that share one backend index share a group so they don't fake consensus
#   page_delay    seconds to wait between pages of the same engine
#
# Sources: OnionSearch, darkdump, Robin, VoidAccess, OnionClaw, SearXNG, SpiderFoot, deepdarkCTI,
# onion.live and the engines' own clearnet pages (checked 2026-10-02). Addresses drift - run
# `onionscope engines --probe` with Tor running to see which ones answer today.

# ----------------------------------------------------------------------------------------------
# Core tier: dedicated parsers
# ----------------------------------------------------------------------------------------------

[[engine]]
name = "ahmia"
label = "Ahmia"
tier = "core"
parser = "ahmia"
prep = "ahmia_token"
mirrors = ["juhanurmihxlp77nkq76byazcldy2hlmovfu2epvl5ankdibsot4csyd.onion"]
clearnet = "https://ahmia.fi"
search_path = "/search/?q={q}"
